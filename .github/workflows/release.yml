name: Release

# Сборка и публикация релиза при выходе тега вида v1.2.3.
#
# Сборка идёт на сервере GitHub: это гарантирует, что приложенный к релизу
# архив собран из того же кода, что отмечен тегом, а не из локальной копии.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Публикация приложения и службы
        working-directory: csharp
        run: |
          dotnet publish OpenTuyaSync.Agent\OpenTuyaSync.Agent.csproj -c Release -o Releases --nologo -v q
          dotnet publish OpenTuyaSync.Service\OpenTuyaSync.Service.csproj -c Release -o Releases --nologo -v q

      - name: Публикация теста подсветки
        working-directory: csharp
        run: dotnet publish tools\ColorTest\ColorTest.csproj -c Release -o Releases\tools\ColorTest --nologo -v q

      - name: Подготовка вспомогательных файлов
        working-directory: csharp
        shell: pwsh
        run: |
          # Отладочные символы в релизе не нужны.
          Get-ChildItem Releases -Recurse -Include *.pdb | Remove-Item -Force

          # Настройки, инструкция, значки.
          Copy-Item release-files\config.json Releases\ -Force
          Copy-Item release-files\*.bat Releases\ -Force
          Copy-Item release-files\*.txt Releases\ -Force
          Copy-Item assets\icon.ico Releases\ -Force

          # Полная справка: markdown преобразуется в обычный текст.
          powershell -NoProfile -ExecutionPolicy Bypass -File make-guide.ps1 -Output Releases

      - name: Сборка архива
        working-directory: csharp
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $zip = "Releases\OpenTuyaSync-v$version.zip"
          Compress-Archive -Path 'Releases\*' -DestinationPath $zip -CompressionLevel Optimal
          Write-Output "Архив: $zip ($([math]::Round((Get-Item $zip).Length/1MB,2)) МБ)"

      - name: Проверка, что приложение запускается
        working-directory: csharp
        shell: pwsh
        run: |
          # Самопроверка теста подсветки: окно не показывается, но заливка
          # строится и результат пишется в отчёт.
          & 'Releases\tools\ColorTest\OpenTuyaSync.ColorTest.exe' --selftest
          Start-Sleep -Seconds 3

          $report = 'Releases\tools\ColorTest\selftest_report.txt'
          if (-not (Test-Path $report)) { throw 'Самопроверка не создала отчёт' }

          Get-Content $report -Encoding UTF8 | Write-Output
          if (-not (Select-String -Path $report -Pattern 'заливка строится всеми эффектами')) {
            throw 'Самопроверка теста подсветки не прошла'
          }

          # Следы проверки в архив не попадают.
          Remove-Item 'Releases\tools\ColorTest\selftest_*' -Force -ErrorAction SilentlyContinue
          Remove-Item "Releases\tools\ColorTest\colortest_*" -Force -ErrorAction SilentlyContinue

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: csharp/Releases/OpenTuyaSync-*.zip
          generate_release_notes: false
          body_path: csharp/release-files/ОПИСАНИЕ-РЕЛИЗА.md
