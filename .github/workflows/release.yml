name: Release

# Сборка и публикация релиза при выходе тега вида v1.2.3.
#
# Сборка идёт на сервере GitHub: это гарантирует, что приложенный к релизу
# архив собран из того же кода, что отмечен тегом, а не из локальной копии.
#
# Локальная сборка для сравнения: csharp\publish-release.cmd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Установка .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Публикация приложения и службы
        working-directory: csharp
        run: |
          dotnet publish OpenTuyaSync.Agent\OpenTuyaSync.Agent.csproj -c Release -o Releases --nologo -v q
          dotnet publish OpenTuyaSync.Service\OpenTuyaSync.Service.csproj -c Release -o Releases --nologo -v q

      - name: Публикация теста подсветки
        working-directory: csharp
        run: dotnet publish tools\ColorTest\ColorTest.csproj -c Release -o Releases\tools\ColorTest --nologo -v q

      - name: Подготовка вспомогательных файлов
        working-directory: csharp
        shell: pwsh
        run: |
          # Отладочные символы в релизе не нужны.
          Get-ChildItem Releases -Recurse -Include *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force

          # Инструкция, скрипты установки и значок.
          #
          # Проверка "Test-Path" нужна потому, что папка может не содержать
          # файлов нужного вида, а Copy-Item на пустом шаблоне падает.
          foreach ($pattern in 'release-files\*.bat', 'release-files\*.txt', 'assets\icon.ico') {
            if (Test-Path $pattern) {
              Copy-Item $pattern Releases\ -Force
              Write-Output "  скопировано: $pattern"
            }
          }

          # Настройки по умолчанию.
          #
          # config.json намеренно не хранится в репозитории: в нём лежат
          # идентификаторы устройств и ключи доступа. Поэтому для релиза
          # создаётся пустой файл настроек -- пользователь заполняет его сам
          # через вкладку «Настройки», а недостающие поля приложение
          # дополняет значениями по умолчанию.
          if (-not (Test-Path 'Releases\config.json')) {
            $config = [ordered]@{
              devices               = @()
              auto_start            = $false
              start_minimized       = $false
              restore_scene_on_exit = $false
              active_source         = 'screen'
              auto_start_capture    = $false
            }
            $config | ConvertTo-Json -Depth 5 | Set-Content 'Releases\config.json' -Encoding UTF8
            Write-Output '  создан пустой config.json'
          }

          # Полная справка: markdown преобразуется в обычный текст.
          powershell -NoProfile -ExecutionPolicy Bypass -File make-guide.ps1 -Output Releases

          if ($LASTEXITCODE -ne 0) { throw "Не удалось собрать справку" }

      - name: Проверка сборки
        working-directory: csharp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($file in 'Releases\OpenTuyaSync.exe',
                            'Releases\OpenTuyaSync.Service.exe',
                            'Releases\tools\ColorTest\OpenTuyaSync.ColorTest.exe',
                            'Releases\СПРАВКА.txt',
                            'Releases\config.json') {
            if (-not (Test-Path $file)) { throw "Не найден файл релиза: $file" }
            $size = [math]::Round((Get-Item $file).Length / 1KB, 1)
            Write-Output "  $file -- $size КБ"
          }

          Write-Output ''
          Write-Output 'Проверка пройдена.'

      - name: Сборка архива
        working-directory: csharp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $zip = "Releases\OpenTuyaSync-v$version.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path 'Releases\*' -DestinationPath $zip -CompressionLevel Optimal
          Write-Output "Архив: $zip ($([math]::Round((Get-Item $zip).Length/1MB,2)) МБ)"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          name: OpenTuya Sync ${{ github.ref_name }}
          files: csharp/Releases/OpenTuyaSync-*.zip
          generate_release_notes: false
          body_path: csharp/release-files/ОПИСАНИЕ-РЕЛИЗА.md
