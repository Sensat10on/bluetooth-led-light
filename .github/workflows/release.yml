name: Release

# Сборка и публикация релиза при выходе тега вида v1.2.3.
#
# Сборка идёт на сервере GitHub: это гарантирует, что приложенный к релизу
# архив собран из того же кода, что отмечен тегом, а не из локальной копии.
#
# Локальная сборка для сравнения: csharp\publish-release.cmd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Установка .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Сборка идёт тем же скриптом, что и локально: проекты собираются
      # параллельно, вспомогательные файлы копируются, справка собирается,
      # и архив упаковывается. Так релиз с сервера не отличается от
      # локального, а логика сборки описана в одном месте.
      - name: Сборка релиза
        working-directory: csharp
        shell: pwsh
        run: |
          # Версию берём из тега, чтобы имя архива совпадало с релизом.
          $version = '${{ github.ref_name }}' -replace '^v', ''

          & powershell -NoProfile -ExecutionPolicy Bypass `
              -File publish-release.ps1 -Version $version

          if ($LASTEXITCODE -ne 0) { throw 'Сборка релиза не удалась' }

      # Вспомогательные файлы, настройки и справку готовит сам
      # publish-release.ps1: отдельный шаг не нужен.

      - name: Проверка сборки
        working-directory: csharp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($file in 'Releases\OpenTuyaSync.exe',
                            'Releases\OpenTuyaSync.Service.exe',
                            'Releases\tools\ColorTest\OpenTuyaSync.ColorTest.exe',
                            'Releases\ВОССТАНОВИТЬ-BLUETOOTH.ps1',
                            'Releases\СПРАВКА.txt',
                            'Releases\config.json') {
            if (-not (Test-Path $file)) { throw "Не найден файл релиза: $file" }
            $size = [math]::Round((Get-Item $file).Length / 1KB, 1)
            Write-Output "  $file -- $size КБ"
          }

          # Архив собирает сам publish-release.ps1 -- проверяем, что он есть.
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $zip = "Releases\OpenTuyaSync-v$version.zip"

          if (-not (Test-Path $zip)) { throw "Не найден архив релиза: $zip" }
          Write-Output ''
          Write-Output "  $zip -- $([math]::Round((Get-Item $zip).Length / 1MB, 2)) МБ"
          Write-Output ''
          Write-Output 'Проверка пройдена.'

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          name: OpenTuya Sync ${{ github.ref_name }}
          files: csharp/Releases/OpenTuyaSync-*.zip
          generate_release_notes: false
          body_path: csharp/release-files/ОПИСАНИЕ-РЕЛИЗА.md
